name: Package and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify required secrets
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::error::CF_API_KEY secret is not set on this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Check TOC versions and tokens
        run: |
          set -e
          for toc in */*_Camelot.toc; do
            grep -q '^## Version: @project-version@' "$toc" || { echo "::error::$toc does not use @project-version@"; exit 1; }
          done
          if grep -rl -- '--@localization' --include='*.lua' .; then
            echo "::error::@localization tokens must not ship"; exit 1
          fi

      - name: Build per-release changelog
        run: awk '/^## / { if (seen) exit; seen=1 } seen' CHANGELOG.md > .release_changelog.md

      # The packager leaves --@experimental@ blocks active, which would make every release a "pr" build
      # with WeakAuras' experimental undo switched on.
      - name: Comment out experimental blocks
        run: |
          grep -rl --include='*.lua' --exclude-dir=Libs -- '--@experimental@' EverythingAuras* | xargs -r sed -i \
            -e 's/--@experimental@/--[===[@experimental@/' \
            -e 's/--@end-experimental@/--@end-experimental@]===]/'

      # A build-only pass, so a file the packager breaks never reaches an upload (0.3.0 shipped a broken Archivist.lua).
      - name: Build without uploading
        uses: BigWigsMods/packager@v2
        with:
          args: -d -z

      - name: Compile every packaged Lua file
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 > /dev/null
          total=0
          bad=0
          while IFS= read -r -d '' f; do
            total=$((total + 1))
            sed '1s/^\xEF\xBB\xBF//' "$f" > "$RUNNER_TEMP/check.lua"
            if ! luac5.1 -p "$RUNNER_TEMP/check.lua"; then
              echo "::error file=$f::does not compile under Lua 5.1"
              bad=$((bad + 1))
            fi
          done < <(find .release -name '*.lua' -print0)
          echo "luac: $total files, $bad failures"
          [ "$total" -gt 0 ] && [ "$bad" -eq 0 ]

      # The packager reads the CurseForge id only from ## X-Curse-Project-ID in the TOC and picks
      # the release channel from the tag name (a tag containing "beta" uploads as Beta).
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
